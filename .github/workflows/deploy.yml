name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild picks up new YouTube episodes (06:00 UTC = 10:00 Baku).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch episodes from the YouTube RSS feed
        run: npm run episodes
      # Keeps the archive growing (the feed lists only the last 15 items).
      # A push made with GITHUB_TOKEN does not start another workflow run.
      - name: Save new episodes to the repo
        run: |
          if ! git diff --quiet content/episodes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update episodes from YouTube RSS" content/episodes.json
            git pull --rebase && git push
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
